<head>

<title>dwsjoan</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101218;}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;color:#e8e8ee;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  #loader{--pointer-x:50vw;--pointer-y:50vh;--aura-opacity:0;--switch-x:72%;--switch-y:58%;--switch-light-x:-999px;--switch-light-y:-999px;position:fixed;inset:0;z-index:50;box-sizing:border-box;overflow:hidden;isolation:isolate;background:#060706;color:#ddd8ca;opacity:1;touch-action:none;transition:opacity .72s cubic-bezier(.22,.72,0,1);}
  #loader.complete{opacity:0;pointer-events:none;}
  #loader::before{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(180deg,rgba(72,71,67,.16),rgba(36,36,33,.045) 18%,transparent 42%),repeating-linear-gradient(88deg,rgba(255,255,255,.006) 0 1px,transparent 1px 7px);}
  #loader::after{content:"";position:absolute;z-index:0;left:3%;right:3%;top:11%;height:1px;background:linear-gradient(90deg,transparent,rgba(219,216,205,.045) 14%,rgba(219,216,205,.045) 86%,transparent);}
  .loader-aura{position:absolute;z-index:7;left:0;top:0;width:clamp(250px,28vw,380px);aspect-ratio:1;border-radius:50%;pointer-events:none;transform:translate3d(50vw,50vh,0) translate(-50%,-50%);background:radial-gradient(circle at 49% 48.5%,rgba(255,252,239,.32) 0 16%,rgba(250,245,230,.23) 26%,rgba(242,235,218,.1) 36%,rgba(228,221,204,.025) 46%,transparent 53%),radial-gradient(circle at 50% 50%,rgba(238,233,218,.09) 0 35%,rgba(224,219,204,.075) 44%,rgba(202,198,186,.05) 54%,rgba(170,169,160,.02) 64%,transparent 74%),radial-gradient(circle at 51.5% 51%,rgba(184,182,174,.035) 0 58%,rgba(151,150,145,.025) 70%,rgba(117,118,115,.012) 84%,transparent 96%);filter:blur(3px);opacity:var(--aura-opacity);transition:opacity .16s ease;will-change:transform,opacity;}
  .loader-fixture{position:absolute;z-index:3;left:50%;top:1.2%;width:87%;aspect-ratio:10.35/1;overflow:hidden;transform:translateX(-50%);filter:drop-shadow(0 7px 9px rgba(0,0,0,.7)) drop-shadow(0 17px 26px rgba(0,0,0,.32));}
  .loader-fixture-plane{position:absolute;z-index:1;left:0;top:0;width:100%;aspect-ratio:3/1;transform:translateY(-33.1%) translateZ(0);}
  .loader-fixture-photo{position:absolute;z-index:1;inset:0;display:block;width:100%;height:100%;filter:brightness(.42) contrast(1.12) saturate(.62);user-select:none;pointer-events:none;}
  /* 底图与发光层共用 2172×724 坐标平面；玻璃边界为 x=99–2070、y=354–434。 */
  .loader-tube{position:absolute;z-index:2;left:4.558%;right:4.696%;top:48.895%;height:11.05%;overflow:visible;border-radius:999px;}
  .loader-discharge{position:absolute;z-index:2;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(245,242,232,.78) 0,rgba(255,253,244,.96) 36%,rgba(250,238,213,.9) 68%,rgba(219,203,170,.68) 100%);box-shadow:inset 0 1px rgba(255,255,255,.7),0 0 3px rgba(255,250,230,.92),0 6px 17px rgba(249,223,166,.44),0 17px 40px rgba(238,199,123,.16);opacity:0;mix-blend-mode:screen;transition:opacity .14s linear;}
  .loader-discharge::after{content:"";position:absolute;left:1.2%;right:1.2%;top:13%;height:20%;border-radius:999px;background:rgba(255,255,255,.5);filter:blur(.65px);}
  .loader-electrode{position:absolute;z-index:3;top:24%;bottom:24%;width:.55%;min-width:1px;border-radius:48%;opacity:0;background:linear-gradient(180deg,transparent 0,rgba(211,78,24,.12) 23%,rgba(255,139,58,.64) 48%,rgba(230,91,28,.18) 76%,transparent 100%);filter:blur(.18px);mix-blend-mode:screen;}
  .loader-electrode.left{left:.55%;}
  .loader-electrode.right{right:.55%;}
  /* 无烟尘的灯下看不到硬光柱：用贴管泛光与宽幅向下衰减，让黑暗空间被真实地推亮。 */
  .loader-beam{position:absolute;z-index:1;left:0;right:0;top:6.6%;height:84%;pointer-events:none;background:radial-gradient(ellipse 64% 15% at 50% 0,rgba(255,252,241,.78) 0,rgba(255,244,218,.38) 31%,rgba(244,220,177,.11) 59%,transparent 84%),radial-gradient(ellipse 92% 92% at 50% -7%,rgba(250,232,195,.24) 0,rgba(244,220,177,.125) 34%,rgba(226,201,160,.048) 58%,rgba(204,182,148,.014) 75%,transparent 94%);filter:blur(15px);mix-blend-mode:screen;opacity:0;transition:opacity .14s linear;will-change:opacity;}
  .loader-beam::before{content:"";position:absolute;left:2.5%;right:2.5%;top:-1.8%;height:15%;border-radius:50%;background:radial-gradient(ellipse at 50% 0,rgba(255,255,249,.82) 0,rgba(255,244,218,.38) 31%,rgba(237,211,169,.1) 61%,transparent 84%);filter:blur(5px);}
  .loader-beam::after{content:"";position:absolute;left:1.5%;right:1.5%;top:4%;bottom:-4%;background:radial-gradient(ellipse 82% 110% at 50% 0,rgba(252,235,202,.16) 0,rgba(238,215,176,.072) 40%,rgba(213,191,157,.026) 68%,transparent 94%);filter:blur(22px);}
  #loader.is-striking .loader-discharge{animation:loader-tube-strike 2.7s steps(1,end) infinite;}
  #loader.is-striking .loader-electrode{animation:loader-electrode-strike 2.7s steps(1,end) infinite;}
  #loader.is-striking .loader-beam{animation:loader-beam-strike 2.7s steps(1,end) infinite;}
  #loader.is-stable .loader-discharge{opacity:1;}
  #loader.is-stable .loader-beam{opacity:.68;}
  .loader-switch{position:absolute;z-index:5;left:var(--switch-x);top:var(--switch-y);width:42px;height:58px;padding:0;border:0;appearance:none;background:transparent;transform:translate(-50%,-50%);}
  .loader-switch::before{content:"";position:absolute;inset:0;border:1px solid rgba(151,150,144,.055);border-radius:2px;background:#10110f;box-shadow:0 8px 15px rgba(0,0,0,.34);opacity:.7;}
  .loader-switch-plate{position:absolute;inset:0;border:1px solid rgba(219,216,205,.44);border-radius:2px;background:linear-gradient(145deg,#c8c5bb 0,#8f8d85 52%,#63645f 100%);box-shadow:inset 1px 1px 1px rgba(255,255,255,.38),inset -1px -1px 2px rgba(0,0,0,.42),0 8px 15px rgba(0,0,0,.5);-webkit-mask-image:radial-gradient(circle 108px at var(--switch-light-x) var(--switch-light-y),#000 0 18%,rgba(0,0,0,.88) 37%,rgba(0,0,0,.38) 60%,transparent 78%);mask-image:radial-gradient(circle 108px at var(--switch-light-x) var(--switch-light-y),#000 0 18%,rgba(0,0,0,.88) 37%,rgba(0,0,0,.38) 60%,transparent 78%);}
  .loader-switch-rocker{position:absolute;left:8px;right:8px;top:10px;bottom:10px;border:1px solid rgba(50,51,48,.45);border-radius:1px;background:linear-gradient(180deg,#b9b6ad 0 46%,#7b7b75 54% 100%);box-shadow:inset 0 2px 2px rgba(255,255,255,.22),inset 0 -3px 4px rgba(0,0,0,.26);transform-origin:50% 52%;transition:transform .16s ease,background .16s ease;}
  .loader-switch-screws{position:absolute;inset:0;background:radial-gradient(circle at 50% 6px,#30312f 0 1px,#aaa79f 1.2px 2px,transparent 2.2px),radial-gradient(circle at 50% calc(100% - 6px),#30312f 0 1px,#aaa79f 1.2px 2px,transparent 2.2px);pointer-events:none;}
  #loader.is-switched-on .loader-switch-rocker{background:linear-gradient(180deg,#777872 0 46%,#b1afa7 54% 100%);transform:perspective(80px) rotateX(-13deg) translateY(1px);}
  .loader-switch:focus-visible{outline:1px solid rgba(241,235,217,.86);outline-offset:6px;}
  .loader-switch:focus-visible .loader-switch-plate{-webkit-mask-image:none;mask-image:none;}
  .loader-error-copy{position:absolute;z-index:8;left:50%;bottom:34px;margin:0;color:rgba(202,137,124,.8);font:500 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;opacity:0;transform:translateX(-50%);}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
  #loader.error .loader-discharge{opacity:.06;animation:none;}
  #loader.error .loader-electrode,#loader.error .loader-beam{opacity:0;animation:none;}
  #loader.error .loader-error-copy{opacity:1;}
  @keyframes loader-electrode-strike{0%,31.9%{opacity:.24}32%,35.9%{opacity:.01}36%,47.9%{opacity:.16}48%,51.9%{opacity:.015}52%,69.9%{opacity:.1}70%,100%{opacity:.01}}
  @keyframes loader-tube-strike{0%,31.9%{opacity:.025}32%,35.9%{opacity:1}36%,47.9%{opacity:.055}48%,51.9%{opacity:.72}52%,69.9%{opacity:.09}70%,73.9%{opacity:1}74%,100%{opacity:.36}}
  @keyframes loader-beam-strike{0%,31.9%{opacity:0}32%,35.9%{opacity:.74}36%,47.9%{opacity:.018}48%,51.9%{opacity:.48}52%,69.9%{opacity:.035}70%,73.9%{opacity:.78}74%,100%{opacity:.18}}
  @media (pointer:fine){#loader.has-pointer{cursor:none}#loader.has-pointer .loader-switch{cursor:none}}
  #title{position:fixed;left:26px;top:24px;font-size:12px;letter-spacing:.4em;
    color:rgba(232,232,238,.6);pointer-events:none;z-index:10;}
  #title b{color:rgba(232,232,238,.95);font-weight:600;}
  #hint{position:fixed;left:50%;bottom:24px;width:max-content;max-width:calc(100vw - 48px);
    transform:translateX(-50%);font-size:12px;line-height:1.55;letter-spacing:.08em;text-align:center;
    color:rgba(255,255,255,.92);pointer-events:none;z-index:39;transition:opacity .2s;}
  #hint[data-kind="idle"]{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.58);}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;}
  #legionScreenLayer{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;visibility:hidden;}
  #legionScreenLayer.active{opacity:1;visibility:visible;}
  #legionScreenDesktop,#skyworthScreenDesktop{position:relative;overflow:hidden;background:#0c0c13;pointer-events:auto;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.04);}
  /* CSS3D 透视下 overflow 裁剪会错切顶栏命中区；iframe 自身负责裁剪桌面内容。 */
  #legionScreenDesktop{overflow:visible;}
  #legionScreenDesktop iframe,#legionScreenMobile iframe,#skyworthScreenDesktop iframe,#skyworthScreenMobile iframe{display:block;width:100%;height:100%;border:0;background:#0c0c13;}
  #skyworthScreenDesktop,#skyworthScreenDesktop iframe,#skyworthScreenMobile,#skyworthScreenMobile iframe{background:#f3f0e9;}
  #legionScreenDesktop::after,#skyworthScreenDesktop::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(118deg,rgba(255,255,255,.055),transparent 31% 72%,rgba(255,255,255,.025));
    box-shadow:inset 0 0 34px rgba(0,0,0,.22);}
  #legionScreenMobile,#skyworthScreenMobile{display:block;position:fixed;inset:0;z-index:35;background:#0c0c13;
    opacity:0;visibility:hidden;pointer-events:none;}
  #legionScreenMobile.active,#skyworthScreenMobile.active{opacity:1;visibility:visible;pointer-events:auto;}
  #legionScreenExit{display:none;position:fixed;right:24px;top:22px;z-index:38;border:1px solid rgba(232,232,238,.34);
    background:rgba(12,12,19,.82);color:#e8e8ee;padding:9px 12px;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #legionScreenExit.active{display:block;}
  #legionScreenExit:hover,#legionScreenExit:focus-visible{background:#e8e8ee;color:#101218;outline:none;}
  #layoutToggle{position:fixed;right:26px;top:20px;z-index:31;padding:8px 10px;
    border:1px solid rgba(232,232,238,.25);background:rgba(14,16,22,.72);color:#e8e8ee;
    font:11px/1 "Helvetica Neue",Arial,"PingFang SC",sans-serif;letter-spacing:.16em;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  #layoutToggle:hover,#layoutToggle:focus-visible{background:#e8e8ee;color:#101218;outline:none;}
  #layoutPanel{position:fixed;right:26px;top:58px;z-index:32;width:274px;box-sizing:border-box;
    max-height:calc(100vh - 82px);overflow:auto;padding:16px;background:rgba(14,16,22,.92);
    border:1px solid rgba(232,232,238,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  #layoutPanel[hidden]{display:none;}
  #layoutPanel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
    font-size:10px;letter-spacing:.24em;color:rgba(232,232,238,.58);}
  #layoutClose{border:0;background:transparent;color:rgba(232,232,238,.6);font-size:16px;cursor:pointer;}
  #layoutPanel label{display:block;margin-bottom:9px;color:rgba(232,232,238,.62);font-size:10px;letter-spacing:.14em;}
  #layoutPanel select,#layoutPanel input,#layoutCode{box-sizing:border-box;width:100%;margin-top:5px;
    border:1px solid rgba(232,232,238,.19);border-radius:0;background:rgba(232,232,238,.07);color:#e8e8ee;
    font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px;}
  #layoutPanel select:focus,#layoutPanel input:focus,#layoutCode:focus{outline:1px solid rgba(232,232,238,.7);}
  .layout-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .layout-fields label{min-width:0;}
  #layoutCode{height:68px;resize:none;line-height:1.45;color:rgba(232,232,238,.82);}
  .layout-actions{display:flex;gap:8px;margin-top:10px;}
  .layout-actions button{flex:1;border:1px solid rgba(232,232,238,.25);background:transparent;color:#e8e8ee;
    padding:8px 4px;font:10px/1 "Helvetica Neue",Arial,"PingFang SC",sans-serif;letter-spacing:.12em;cursor:pointer;}
  .layout-actions button:hover,.layout-actions button:focus-visible{background:#e8e8ee;color:#101218;outline:none;}
  #layoutStatus{display:block;min-height:1.3em;margin-top:9px;color:rgba(232,232,238,.45);font-size:10px;letter-spacing:.08em;}
  .layout-section{margin-top:15px;padding-top:14px;border-top:1px solid rgba(232,232,238,.13);}
  .layout-section h2{margin:0 0 11px;color:rgba(232,232,238,.58);font-size:10px;font-weight:500;letter-spacing:.24em;}
  @media (max-width:640px){
    #loader::after{top:5.9%;}
    .loader-fixture{top:1.25%;width:90%;}
    .loader-beam{top:4.2%;height:80%;}
    .loader-aura{width:240px;}
    .loader-switch{width:38px;height:54px;}
    #hint{bottom:18px;width:calc(100vw - 40px);max-width:none;font-size:11px;line-height:1.5;}
    #layoutToggle{right:12px;top:12px;}
    #layoutPanel{right:12px;left:12px;top:52px;width:auto;max-height:calc(100vh - 70px);}
    #legionScreenLayer{display:none!important;}
    #legionScreenExit{right:10px;top:auto;bottom:44px;padding:8px 10px;background:rgba(12,12,19,.9);}
  }
  @media (prefers-reduced-motion:reduce){
    #loader,.loader-aura,.loader-switch,.loader-switch::before{transition-duration:.01ms;}
    .loader-discharge,.loader-electrode,.loader-beam{animation:none!important;}
    #loader.is-striking .loader-discharge{opacity:.36;}
    #loader.is-striking .loader-electrode{opacity:.09;}
    #loader.is-striking .loader-beam{opacity:.21;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="title"><b>JOAN</b> · 工位 WORKSTATION</div>
<div id="hint" role="status" aria-live="polite" aria-atomic="true" data-kind="idle">ESC 退出特写</div>
<button id="layoutToggle" type="button" aria-controls="layoutPanel" aria-expanded="false">调整场景</button>
<aside id="layoutPanel" aria-label="场景手动调整" hidden>
  <header><span>SCENE / 手动校准</span><button id="layoutClose" type="button" aria-label="关闭场景调整面板">×</button></header>
  <label>模型<select id="layoutModel" aria-label="选择模型"></select></label>
  <div class="layout-fields">
    <label>X<input id="layoutX" type="number" step="0.005" inputmode="decimal"></label>
    <label>Y<input id="layoutY" type="number" step="0.005" inputmode="decimal"></label>
    <label>Z<input id="layoutZ" type="number" step="0.005" inputmode="decimal"></label>
    <label>缩放<input id="layoutScale" type="number" min="0.1" step="0.01" inputmode="decimal"></label>
    <label>Y 旋转（度）<input id="layoutRotation" type="number" step="1" inputmode="decimal"></label>
  </div>
  <label>当前参数<textarea id="layoutCode" readonly aria-label="当前模型参数"></textarea></label>
  <div class="layout-actions"><button id="layoutReset" type="button">重置当前</button><button id="layoutCopy" type="button">复制参数</button></div>
  <small id="layoutStatus" aria-live="polite">模型加载后可调整</small>
  <section class="layout-section" aria-labelledby="ceilingLightHeading">
    <h2 id="ceilingLightHeading">CEILING BAR / 顶灯灯杆</h2>
    <div class="layout-fields">
      <label>X<input id="ceilingLightX" type="number" step="0.01" inputmode="decimal"></label>
      <label>Y<input id="ceilingLightY" type="number" step="0.01" inputmode="decimal"></label>
      <label>Z<input id="ceilingLightZ" type="number" step="0.01" inputmode="decimal"></label>
      <label>光强<input id="ceilingLightIntensity" type="number" min="0" step="0.05" inputmode="decimal"></label>
    </div>
    <label>当前参数<textarea id="ceilingLightCode" readonly aria-label="当前顶灯参数"></textarea></label>
    <div class="layout-actions"><button id="ceilingLightReset" type="button">重置顶灯</button><button id="ceilingLightCopy" type="button">复制参数</button></div>
    <small id="ceilingLightStatus" aria-live="polite">实时调整高光；烘焙漫反射保持基准灯位。</small>
  </section>
</aside>
<div id="flash"></div>
<div id="legionScreenMobile" aria-hidden="true"><iframe data-src="02-joan-os.html" title="JOAN-OS 主显示屏"></iframe></div>
<div id="skyworthScreenMobile" aria-hidden="true"><iframe data-src="03-type-playground.html" title="JOAN 字体锁屏副屏"></iframe></div>
<button id="legionScreenExit" type="button" aria-label="退出屏幕，返回工位">返回工位</button>
<div id="loader" class="is-awaiting-switch" aria-busy="true" data-progress="0">
  <div class="loader-aura" aria-hidden="true"></div>
  <div class="loader-beam" aria-hidden="true"></div>
  <div class="loader-fixture" aria-hidden="true">
    <div class="loader-fixture-plane">
      <img class="loader-fixture-photo" src="assets/ceiling-fluorescent-off.png" width="2172" height="724" alt="" draggable="false" decoding="async" fetchpriority="high">
      <span class="loader-tube">
        <i class="loader-electrode left"></i>
        <i class="loader-electrode right"></i>
        <i class="loader-discharge"></i>
      </span>
    </div>
  </div>
  <button class="loader-switch" id="loaderSwitch" type="button" aria-label="打开天花灯" aria-pressed="false" data-reveal="0">
    <span class="loader-switch-plate" aria-hidden="true">
      <i class="loader-switch-rocker"></i>
      <i class="loader-switch-screws"></i>
    </span>
    <span class="sr-only">打开天花灯</span>
  </button>
  <p class="loader-error-copy" aria-hidden="true">房间没有亮起来 · 刷新重试</p>
  <span class="sr-only" id="loaderStatus" role="status" aria-live="polite">在黑暗中寻找墙上的灯开关</span>
  <span class="sr-only" id="loaderPercent">0</span>
  <span class="sr-only" id="loaderProgress" aria-hidden="true"></span>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {CSS3DRenderer,CSS3DObject} from 'three/addons/renderers/CSS3DRenderer.js';

/* ================= 基础 ================= */
const app=document.getElementById('app');
const debugParams=new URLSearchParams(location.search);
const requestedPixelRatio=Number(debugParams.get('pixelRatio'));
const maxPixelRatio=Number.isFinite(requestedPixelRatio)&&requestedPixelRatio>0?requestedPixelRatio:1.5;
const renderer=new THREE.WebGLRenderer({antialias:true});
const settledPixelRatio=Math.min(devicePixelRatio,maxPixelRatio);
const interactionPixelRatio=Math.min(settledPixelRatio,.75);
// 黑暗探索阶段画布被不透明加载层完全遮住，先用交互分辨率做后台提交，避免初始化争抢手电筒帧。
renderer.setPixelRatio(interactionPixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
// 阴影已经进入静态 lightmap；当前两盏 RectAreaLight 只补实时高光，不再建立无效阴影管线。
renderer.shadowMap.enabled=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=2;
RectAreaLightUniformsLib.init();

function B(parent,w,h,d,mat,x,y,z,o){
  o=o||{};
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;
  m.castShadow=o.cast!==false;m.receiveShadow=o.recv!==false;
  (parent||root).add(m);return m;
}
function Cyl(parent,rt,rb,h,mat,x,y,z,o){
  o=o||{};
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||24),mat);
  m.position.set(x,y,z);
  if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;
  m.castShadow=o.cast!==false;m.receiveShadow=o.recv!==false;
  (parent||root).add(m);return m;
}

function finishCameraReturn(){

function camTick(dt){
  const k=1-Math.exp(-3.2*dt);
  if(mode==='orbit'){
    orbit.theta+=(orbit.gt+parX*.12-orbit.theta)*k;
    orbit.phi+=(orbit.gp+parY*.07-orbit.phi)*k;
    orbit.r+=(orbit.gr-orbit.r)*k;
    goalPos.set(
      TARGET.x+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta),
      TARGET.y+orbit.r*Math.cos(orbit.phi),
      TARGET.z+orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta));
    goalLook.copy(TARGET);
    // 轨道角本身已经按 dt 平滑；相机再 lerp 一次会形成二阶滞后，拖动会显得黏和顿。
    camera.position.copy(goalPos);
    curLook.copy(goalLook);
  }else if(mode==='returning'){
    returnView.elapsed=Math.min(returnView.duration,returnView.elapsed+dt);
    // 与进入特写共用同一阻尼；2.4 秒只负责在运动已低于感知后交还环视。
    camera.position.lerp(returnView.pos,k);
    curLook.lerp(returnView.look,k);
    if(returnView.elapsed>=returnView.duration)finishCameraReturn();
  }else{
    camera.position.lerp(goalPos,k);
    curLook.lerp(goalLook,k);

  const hoverName=hoverKey?interactives[hoverKey]?.label:'';
  const focusDetail=mode==='focus'?interactives[focusKey]?.detail:'';
  hintEl.textContent=hoverName||focusDetail||IDLE_HINT;
  hintEl.dataset.kind=hoverName?'hover':(focusDetail?'detail':'idle');
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!layoutPanelEl.hidden)setLayoutPanelOpen(false);
  else if(e.key==='Escape')unfocus();
  else if(mode==='focus'&&focusKey==='keyboard'){
    let h=0;for(const ch of e.key)h=h*31+ch.charCodeAt(0);
    pressKey(Math.abs(h));thock();
  }
});

/* ================= 指针 ================= */
let pdown=false,moved=0,px=0,py=0,hovered=null;
let qualityRestoreTimer=0;
const interactionSurfaceBounds=new WeakMap();
const directSurfaceInteractions=[
  ['legion','legion'],['mac','skyworth'],['keyboard','keyboard'],['mouse','mouse'],
  ['lamp','lamp'],['mug','mug'],['microphone','microphone']
];
const directSurfaceAssetKeys=new Set(directSurfaceInteractions.map(([,assetKey])=>assetKey));
const surfaceInteractions=[...directSurfaceInteractions,
  ...ASSET_LAYOUT.filter(spec=>spec.key!=='cabinet'&&!directSurfaceAssetKeys.has(spec.key))
    .map(spec=>[spec.key==='mousepad'?'mousepad':FUTURE_AREA_KEY,spec.key])
];
const directSurfaceAssetByKey=Object.fromEntries(directSurfaceInteractions);
const cabinetRegionKeys=new Set(['drawer','cabinetUpper','cabinetLower']);
function setInteractionQuality(active){
  clearTimeout(qualityRestoreTimer);
  if(active){renderer.setPixelRatio(interactionPixelRatio);return;}
  qualityRestoreTimer=setTimeout(()=>renderer.setPixelRatio(settledPixelRatio),420);
}
function invalidateInteractionSurfaceBounds(asset){
  if(asset)interactionSurfaceBounds.delete(asset);
}
function firstVisibleAssetHit(assetKey){
  const root=assembledAssets[assetKey];
  if(!root||!assembledRoot.visible)return null;
  let bounds=interactionSurfaceBounds.get(root);
  if(!bounds){
    root.updateWorldMatrix(true,true);
    bounds=new THREE.Box3().setFromObject(root);
    interactionSurfaceBounds.set(root,bounds);
  }
  if(!ray.ray.intersectsBox(bounds))return null;
  const intersections=ray.intersectObject(root,true);
  return intersections.find(hit=>{
    let node=hit.object;
    while(node){
      if(!node.visible)return false;
      if(node===root)return true;
      node=node.parent;
    }
    return false;
  })||null;
}
function interactionKeyFromRay(){
  let closestSurface=null;
  for(const [key,assetKey] of surfaceInteractions){
    const surface=firstVisibleAssetHit(assetKey);
    if(surface&&(!closestSurface||surface.distance<closestSurface.distance)){
      closestSurface={key:key,distance:surface.distance};
    }
  }
  if(closestSurface)return closestSurface.key;

  const intersections=ray.intersectObjects(hits,false);
  let cabinetSurface;
  for(const hit of intersections){
    const key=hit.object.userData.key;
    // 独立模型加载后只认真实表面，不再让旧盒子在空白处产生幽灵命中。
    if(directSurfaceAssetByKey[key]&&assembledAssets[directSurfaceAssetByKey[key]])continue;
    if(cabinetRegionKeys.has(key)&&assembledAssets.cabinet){
      if(cabinetSurface===undefined)cabinetSurface=firstVisibleAssetHit('cabinet');
      if(!cabinetSurface)continue;
    }
    return key;
  }
  return null;
}
renderer.domElement.addEventListener('pointerdown',e=>{
  pdown=true;moved=0;px=e.clientX;py=e.clientY;setInteractionQuality(true);
});
addEventListener('pointermove',e=>{
  if(mode==='orbit'){
    parX=(e.clientX/innerWidth-.5)*2;
    parY=(e.clientY/innerHeight-.5)*2;
  }
  if(e.target.closest?.('#loader'))return;
  if(pdown&&mode==='orbit'){
    const dx=e.clientX-px,dy=e.clientY-py;
    moved+=Math.abs(dx)+Math.abs(dy);
    orbit.gt=THREE.MathUtils.clamp(orbit.gt-dx*.004,-.6,.6);
    orbit.gp=THREE.MathUtils.clamp(orbit.gp-dy*.003,1.0,1.42);
    px=e.clientX;py=e.clientY;
  }
  if(pdown){hovered=null;syncNarrator();document.body.style.cursor='grabbing';return;}
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const k=interactionKeyFromRay();
  if(k!==hovered){
    hovered=k;
    syncNarrator();
    document.body.style.cursor=k&&!interactives[k]?.passive?'pointer':'default';
  }
});
addEventListener('pointerup',e=>{
  if(e.target.closest?.('#loader'))return;
  pdown=false;setInteractionQuality(false);document.body.style.cursor='default';
  if(e.target.closest('#layoutPanel')||e.target.closest('#layoutToggle'))return;
  if(moved>8)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const k=interactionKeyFromRay();
  if(k){
    if(mode==='focus'&&k===focusKey){
      const it=interactives[k];if(it.act)it.act();
    }else focusOn(k);
  }else if(mode==='focus')unfocus();
});
addEventListener('pointercancel',()=>{
  pdown=false;hovered=null;syncNarrator();setInteractionQuality(false);document.body.style.cursor='default';
});
addEventListener('pointerleave',()=>{hovered=null;syncNarrator();document.body.style.cursor='default';});
renderer.domElement.addEventListener('wheel',e=>{
  if(mode!=='orbit')return;
  setInteractionQuality(true);setInteractionQuality(false);
  orbit.gr=THREE.MathUtils.clamp(orbit.gr+e.deltaY*.0012,1.5,5.2);
},{passive:true});

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const t=now/1000;
  // 入场后收紧轨道默认值
  if(t>1.2&&orbit.gr===2.45&&orbit.gt===0){/*noop*/}
  // 键盘按键回弹 + RGB 流光
  if(root.visible){
    for(const k of keys){
      if(k.t>0){k.t-=dt*6;k.m.position.y=k.y-.005*Math.max(0,Math.min(1,k.t));}
    }
  const hue=(t*.04)%1;
    glowMat.color.setHSL(.42+.12*Math.sin(t*.5),.95,.55);
    // 旧原型隐藏后不再更新其风扇、抽屉、小鸡和灰尘。
    fanSpeed+=((fanOn?22:0)-fanSpeed)*Math.min(1,dt*1.4);
    blades.rotation.z-=fanSpeed*dt;
    if(fanOn)fanHead.rotation.y=Math.sin(t*.7)*.25;
    drawerT+=((drawerOpen?1:0)-drawerT)*Math.min(1,dt*5);
    drawer.position.z=drawerT*.27;
    chick.scale.y=1+Math.sin(t*2.2)*.04;
    const dp=window.__dust.geometry.attributes.position;
    for(let i=0;i<dp.count;i++){
      dp.array[i*3+1]+=Math.sin(t*.5+i)*.00012;
      dp.array[i*3]+=Math.cos(t*.3+i*1.7)*.00008;}
    dp.needsUpdate=true;
  }
  camTick(dt);
  // 加载遮罩后由 prewarmAsset 分帧提交；主循环不要在同一帧重复绘制正在预热的模型。
  if(loaderScenePrimePromise||loaderEntryStarted)renderer.render(scene,camera);
  if((joanOsInteractive||typeLockInteractive)&&!usesMobileInteractiveScreen())legionScreenRenderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 入场
setTimeout(()=>{orbit.gt=.18;orbit.gp=1.34;orbit.gr=2.65;},80);

/* 调试钩子 */
window.ROOM={
  focus:focusOn,unfocus:unfocus,
  snap(){
    if(mode==='returning')finishCameraReturn();
    else{camera.position.copy(goalPos);curLook.copy(goalLook);}
    camera.lookAt(curLook);
  },
  state(){return{
    ready:formalAssetsReady,allAssetsReady:formalAllAssetsReady,error:formalLoadError,
    loaderSwitchActivated:loaderSwitchActivated,loaderAssetsReady:loaderAssetsReady,
    loaderSwitchPosition:[...loaderSwitchPosition],
    loaderPhase:loaderEntryStarted?'stable':(loaderSwitchActivated?'striking':'awaiting-switch'),
    loaderScenePrimed:loaderScenePrimed,
    renderer:'three-webgl-raster',requiresConvergence:false,
    mode:mode,focusKey:focusKey,legionMode:legionMode,
    screenOff:{legion:!legionAwake(),mac:!macAwake()},
    legionWebglScreenOff:isLegionWebglScreenOff(),skyworthWebglScreenOff:isSkyworthWebglScreenOff(),
    joanOsInteractive:joanOsInteractive,joanOsSurface:joanOsInteractive?(usesMobileJoanOs()?'mobile':'desktop'):null,
    typeLockInteractive:typeLockInteractive,typeLockSurface:typeLockInteractive?(usesMobileInteractiveScreen()?'mobile':'desktop'):null,
    fanOn:fanOn,drawerOpen:drawerOpen,lampOn:lampOn,
    camera:camera.position.toArray(),target:curLook.toArray(),orbitGoal:[orbit.gt,orbit.gp,orbit.gr],
    fallbackVisible:root.visible,formalVisible:loaderScenePrimed&&assembledRoot.visible,
    assets:Object.keys(assembledAssets).sort(),
    lightmappedMeshes:lightmappedMeshes,debugWithoutLightmap:debugWithoutLightmap,
    mugReflectionProbeReady:formalMugReflectionProbeReady,mugReflectionProbeSource:formalMugReflectionProbeSource,
    prewarmDurations:{...formalPrewarmDurations},
    prewarmMaxChunkDurations:{...formalPrewarmMaxChunkDurations},
    lockReceiverFrontMeshes:lockReceiverFrontMeshes,lockReceiverEdgeMeshes:lockReceiverEdgeMeshes,
    mergedDrawMeshes:mergedDrawMeshes,
    renderInfo:{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,
      programs:renderer.info.programs.length,pixelRatio:renderer.getPixelRatio()},
    lights:scene.children.filter(node=>node.isLight).map(node=>node.name).sort()
  };},
  screenPose(key){
    if(key!=='mac')return null;
    const pose=getSkyworthScreenPose();
    return pose?{center:pose.center.toArray(),normal:pose.normal.toArray()}:null;
  },
  assets(){return{loaded:Object.keys(assembledAssets)};},
  layout:layoutValues,
  ceilingLight:ceilingLightValues
};
</script>
